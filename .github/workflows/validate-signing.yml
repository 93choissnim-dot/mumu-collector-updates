name: Validate Windows signing gates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['release_tools/**', '.github/workflows/validate-signing.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Validate signing contracts
        working-directory: release_tools
        shell: pwsh
        run: |
          python -m unittest -q test_signing
          if ($LASTEXITCODE -ne 0) { throw 'Signing contract tests failed' }
      - name: Verify real signed and unsigned executables
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.47 --repo 93choissnim-dot/mumu-collector-updates --dir signing-check --pattern ChankiHelper.exe --pattern checksums.txt
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release download failed' }
          python -c "import hashlib,pathlib; p=pathlib.Path('signing-check'); expected=next(s.split()[0] for s in (p/'checksums.txt').read_text().splitlines() if s.endswith('ChankiHelper.exe')); assert hashlib.sha256((p/'ChankiHelper.exe').read_bytes()).hexdigest()==expected"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned release checksum mismatch' }
          python release_tools/validate_windows_signing.py signing-check/ChankiHelper.exe
          if ($LASTEXITCODE -ne 0) { throw 'Windows Authenticode verification failed' }
