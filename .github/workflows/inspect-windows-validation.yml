name: Inspect Windows validation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-windows-validation.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Read EXE validation logs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 35498291103 --repo 93choissnim-dot/mumu-collector-updates --name windows-exe-validation-v0.7.8 --dir validation
          if ($LASTEXITCODE -ne 0) { throw 'Validation artifact download failed' }
          Get-ChildItem validation -Recurse -Filter *.log | ForEach-Object { Get-Content $_.FullName -Raw -Encoding utf8 }
