name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Fetch reviewed source archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.5.0 --repo 93choissnim-dot/mumu-collector-updates --pattern MumuCollector_v0.5.0.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $hash = (Get-FileHash MumuCollector_v0.5.0.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne '7a1c2dd13cdf3e3feee7a7eeeb1ba14b4be8ca1cf11f5ae4d2491a7d42fdd9de') { throw 'Source hash mismatch' }
          Expand-Archive MumuCollector_v0.5.0.zip -DestinationPath source
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install 'pyinstaller>=6.9,<7' 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<6' 'Pillow>=10,<13' 'psutil>=6,<8' 'customtkinter==5.2.2'
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
      - name: Build and validate standalone EXE
        shell: pwsh
        run: |
          python source/MumuCollector_v0.5.0/build_exe.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build or validation failed' }
      - name: Attach tested binaries to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = 'source/MumuCollector_v0.5.0/exe_release'
          gh release upload v0.5.0 --repo 93choissnim-dot/mumu-collector-updates "$out/ChankiHelper.exe" "$out/ChankiHelper_v0.5.0_update.zip" "$out/latest-exe.json" "$out/checksums.txt" "$out/exe-health.json" "$out/windows-validation.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe-validation
          path: |
            source/MumuCollector_v0.5.0/exe_release/*.json
            source/MumuCollector_v0.5.0/exe_release/*.png
            source/MumuCollector_v0.5.0/exe_release/smoke-data/MumuCollector/*log
          if-no-files-found: ignore
