name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-windows.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
      - name: Fetch reviewed source archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.3 --repo 93choissnim-dot/mumu-collector-updates --pattern MumuCollector_v0.7.3.zip
          if ($LASTEXITCODE -ne 0) { throw 'Source download failed' }
          $hash = (Get-FileHash MumuCollector_v0.7.3.zip -Algorithm SHA256).Hash.ToLower()
          if ($hash -ne 'e3466c071e394d2848df173194b72b64061c19069d1184d50efdc65d22b46801') { throw 'Source hash mismatch' }
          Expand-Archive MumuCollector_v0.7.3.zip -DestinationPath source
      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install 'pyinstaller>=6.9,<7' 'numpy>=1.26,<3' 'opencv-python-headless>=4.10,<6' 'Pillow>=10,<13' 'psutil>=6,<8' 'customtkinter==5.2.2' 'pystray==0.19.5'
          if ($LASTEXITCODE -ne 0) { throw 'Dependencies failed' }
      - name: Build and validate standalone EXE
        shell: pwsh
        run: |
          python source/MumuCollector_v0.7.3/validate_names.py
          if ($LASTEXITCODE -ne 0) { throw 'Window name validation failed' }
          python source/MumuCollector_v0.7.3/validate_mumu_ports.py
          if ($LASTEXITCODE -ne 0) { throw 'MuMu missing-port validation failed' }
          python source/MumuCollector_v0.7.3/validate_fleet.py
          if ($LASTEXITCODE -ne 0) { throw 'Fleet validation failed' }
          python source/MumuCollector_v0.7.3/validate_operations.py
          if ($LASTEXITCODE -ne 0) { throw 'Recovery validation failed' }
          python source/MumuCollector_v0.7.3/validate_extra.py
          if ($LASTEXITCODE -ne 0) { throw 'Extra task validation failed' }
          python source/MumuCollector_v0.7.3/validate_collection.py
          if ($LASTEXITCODE -ne 0) { throw 'Collection validation failed' }
          python source/MumuCollector_v0.7.3/validate_overlays.py
          if ($LASTEXITCODE -ne 0) { throw 'Offline reward and recognition validation failed' }
          python source/MumuCollector_v0.7.3/build_exe.py
          if ($LASTEXITCODE -ne 0) { throw 'EXE build or validation failed' }
      - name: Attach tested binaries to draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $out = 'source/MumuCollector_v0.7.3/exe_release'
          gh release upload v0.7.3 --repo 93choissnim-dot/mumu-collector-updates "$out/ChankiHelper.exe" "$out/ChankiHelper_v0.7.3_update.zip" "$out/latest-exe.json" "$out/checksums.txt" "$out/exe-health.json" "$out/windows-validation.json" --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed' }
      - name: Verify uploaded release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.3 --repo 93choissnim-dot/mumu-collector-updates --dir published_verify --pattern ChankiHelper_v0.7.3_update.zip --pattern latest-exe.json
          if ($LASTEXITCODE -ne 0) { throw 'Published verification download failed' }
          python -c "import hashlib,json,pathlib; p=pathlib.Path('published_verify'); m=json.loads((p/'latest-exe.json').read_text(encoding='utf-8')); z=p/'ChankiHelper_v0.7.3_update.zip'; h=hashlib.sha256(z.read_bytes()).hexdigest(); print('REMOTE',h,z.stat().st_size); print('FEED',m['sha256'],m['size']); assert h==m['sha256'] and z.stat().st_size==m['size']; local=pathlib.Path('source/MumuCollector_v0.7.3/exe_release')/z.name; assert z.read_bytes()==local.read_bytes()"
          if ($LASTEXITCODE -ne 0) { throw 'Published bytes differ from tested build' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-exe-validation
          path: |
            source/MumuCollector_v0.7.3/exe_release/*.json
            source/MumuCollector_v0.7.3/exe_release/*.png
            source/MumuCollector_v0.7.3/exe_release/smoke-data/MumuCollector/*log
          if-no-files-found: ignore
