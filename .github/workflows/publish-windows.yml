name: Publish tested Windows update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: chanki-release-v0.7.78
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested build and release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/93choissnim-dot/mumu-collector-updates/actions/runs/36980110855 --jq . > build-run.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify build run' }
          python -c "import json; r=json.load(open('build-run.json',encoding='utf-8-sig')); assert r['conclusion']=='success' and r['head_sha']=='92de441ba0412fb27acc53c724ae74cd93561b3f' and r['name']=='Build Windows EXE', 'Build validation mismatch'"
          if ($LASTEXITCODE -ne 0) { throw 'Build gate failed' }
          gh release view v0.7.78 --repo 93choissnim-dot/mumu-collector-updates --json isDraft,targetCommitish > release-state.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify draft' }
          python -c "import json; r=json.load(open('release-state.json',encoding='utf-8-sig')); assert r['isDraft'] and r['targetCommitish']=='92de441ba0412fb27acc53c724ae74cd93561b3f', 'Release target mismatch'"
          if ($LASTEXITCODE -ne 0) { throw 'Draft gate failed' }
          gh release download v0.7.78 --repo 93choissnim-dot/mumu-collector-updates --dir verified --pattern ChankiHelper.exe --pattern latest-exe.json --pattern ChankiHelper_v0.7.78_update.zip --pattern latest.json --pattern MumuCollector_v0.7.78.zip --pattern exe-health.json --pattern windows-validation.json --pattern windows-previous-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification download failed' }
          @'
          import pathlib, json, hashlib, zipfile
          p = pathlib.Path('verified')
          h = json.loads((p/'exe-health.json').read_text(encoding='utf-8'))
          w = json.loads((p/'windows-validation.json').read_text(encoding='utf-8'))
          assert h['normal_boss_v078'] and h['native_free_routes_v077'] and h['audit_safety_v076'] and h['cooperative_recovery_v075'] and h['store_proof_v075'] and h['reference_reuse_v075'] and h['network_single_v074'] and h['summon_reveal_v073'] and h['free_daily_v072'] and h['storage_halt_v071'] and h['durable_records_v071'] and h['settlement_status_v071'] and h['safe_recovery_v070'] and h['settlement_wait_v070'] and h['diagnostic_retention_v069'] and h['outcome_guidance_v069'] and h['boss_glyph_v068'] and h['action_storage_v068'] and h['today_overview_v067'] and h['dated_run_archive_v067'] and h['navigation_recheck_v067'] and h['guild_loot_after_entries_v066'] and h['completion_handoff_v064'] and h['recovery_handoff_v063'] and h['network_dialog_recovery'] and h['independent_game_watch'] and h['startup_confirmation'] and h['session_workflow'] and h['game_exit_recovery'] and h['workflow_ui'] and h['compact_reliability'] and h['compact_ui'] and h['guild_donation_all_v065'] and h['native_sweep_battle'] and h['guild_pending_resume'] and h['sweep_transition_recovery'] and h['dungeon_pending_resume'] and h['diagnostic_recovery'] and h['training_repeatable_donation'] and h['training_native_retry'] and h['native_paid_pass'] and h['training_input_evidence'] and h['dungeon_native_entry'] and h['combat_start_confirmation'] and h['raid_native_entry'] and h['dungeon_confirmation'] and h['dungeon_completion_review'] and h['raid_repeat_recovery'] and h['pending_history_counts'] and h['input_provenance'] and h['input_evidence'] and h['autumn_native_zero'] and h['native_navigation'] and h['retry_resolution'] and h['history_lifecycle'] and h['reward_recovery'] and h['update_diagnostics'] and h['facility_manual_retry'] and h['ok'] and h['pass_purchase'] and h['guild_empty'] and h['version']=='0.7.78' and h['run_controls_ui'] and h['workspace_ui'] and h['vector_rendering_ui'] and h['game_theme_ui'] and h['improvements_ui'] and h['taskbar_ui'] and h['start_navigation'] and h['daily_tasks'] and h['daily_native_color'] and h['worldboss_recovery'] and h['daily_step_recovery'] and h['diagnostic_trace'] and h['autumn_rewards'] and h['input_safety'] and h['pass_icon_identity'] and h['efficiency_safety'] and h['worldboss_plan'] and h['update_retry'] and h['packaged_regression_checks'] and h['full_ui_checks'] and h['daily_dialogs'] and h['combat_transitions'] and h['first_failure_evidence'] and h['daily_animation_recovery'] and h['guild_native_controls'] and h['cross_feature_audit'] and h['rotating_workshop'] and h['native_exit_recovery'] and h['frozen']
          previous = json.loads((p/'windows-previous-validation.json').read_text(encoding='utf-8'))
          assert previous['ok'] and previous['previous_release_helper'] and previous['real_exe_update'] and previous['restart'] and previous['rollback']
          assert w['ok'] and w['real_exe_update'] and w['restart'] and w['rollback']
          for feed, archive in [('latest-exe.json','ChankiHelper_v0.7.78_update.zip'), ('latest.json','MumuCollector_v0.7.78.zip')]:
              m = json.loads((p/feed).read_text(encoding='utf-8'))
              z = p/archive
              assert m['version']=='0.7.78' and m['size']==z.stat().st_size
              assert m['sha256']==hashlib.sha256(z.read_bytes()).hexdigest()
          with zipfile.ZipFile(p/'ChankiHelper_v0.7.78_update.zip') as z:
              manifest = json.loads(z.read('release.json'))
              exe_name = next(n for n in manifest['files'] if n.lower().endswith('.exe'))
              exe = (p/'ChankiHelper.exe').read_bytes()
              assert z.read(exe_name)==exe
              assert manifest['files'][exe_name]==hashlib.sha256(exe).hexdigest()
              print('Direct EXE SHA256: '+hashlib.sha256(exe).hexdigest())
          print('Reviewed Windows build and both update archives verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release byte validation failed' }
      - name: Publish automatic update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api repos/93choissnim-dot/mumu-collector-updates/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw 'Latest release check failed' }
          if ([version]($latest.TrimStart('v')) -ge [version]'0.7.78') { throw 'Same or newer release already exists' }
          $notes = Get-Content release_source/v0.7.78/notes.md -Raw -Encoding utf8
          $notes += "`n`nWindows 검증 기록: https://github.com/93choissnim-dot/mumu-collector-updates/actions/runs/36980110855`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release edit v0.7.78 --repo 93choissnim-dot/mumu-collector-updates --draft=false --latest --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Verify public automatic update address
        shell: pwsh
        run: |
          @'
          import sys,json,threading
          sys.path.insert(0,'release_source/v0.7.53/patch')
          from updater import read_url
          for name in ('latest-exe.json','latest.json'):
              url='https://github.com/93choissnim-dot/mumu-collector-updates/releases/latest/download/'+name
              actual=json.loads(read_url(url,threading.Event(),65536))
              expected=json.load(open('verified/'+name,encoding='utf-8'))
              assert actual==expected
              print('Public update channel verified: '+name+' v'+actual['version'])
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Public update channel verification failed' }


