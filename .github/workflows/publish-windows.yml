name: Publish tested Windows update
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-windows.yml']
permissions:
  contents: write
  actions: read
concurrency:
  group: chanki-release-v0.7.12
  cancel-in-progress: false
jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify tested build and release bytes
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/93choissnim-dot/mumu-collector-updates/actions/runs/35514758426 --jq . > build-run.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify build run' }
          python -c "import json; r=json.load(open('build-run.json',encoding='utf-8-sig')); assert r['conclusion']=='success' and r['head_sha']=='188e6c59803e279e4cb7b70b1ff7c26c1dcd5639' and r['name']=='Build Windows EXE', 'Build validation mismatch'"
          if ($LASTEXITCODE -ne 0) { throw 'Build gate failed' }
          gh release view v0.7.12 --repo 93choissnim-dot/mumu-collector-updates --json isDraft,targetCommitish > release-state.json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify draft' }
          python -c "import json; r=json.load(open('release-state.json',encoding='utf-8-sig')); assert r['isDraft'] and r['targetCommitish']=='188e6c59803e279e4cb7b70b1ff7c26c1dcd5639', 'Release target mismatch'"
          if ($LASTEXITCODE -ne 0) { throw 'Draft gate failed' }
          gh release download v0.7.12 --repo 93choissnim-dot/mumu-collector-updates --dir verified --pattern latest-exe.json --pattern ChankiHelper_v0.7.12_update.zip --pattern latest.json --pattern MumuCollector_v0.7.12.zip --pattern exe-health.json --pattern windows-validation.json
          if ($LASTEXITCODE -ne 0) { throw 'Release verification download failed' }
          @'
          import pathlib, json, hashlib
          p = pathlib.Path('verified')
          h = json.loads((p/'exe-health.json').read_text(encoding='utf-8'))
          w = json.loads((p/'windows-validation.json').read_text(encoding='utf-8'))
          assert h['ok'] and h['version']=='0.7.12' and h['run_controls_ui'] and h['workspace_ui'] and h['game_theme_ui'] and h['improvements_ui'] and h['taskbar_ui'] and h['full_ui_checks'] and h['frozen']
          assert w['ok'] and w['real_exe_update'] and w['restart'] and w['rollback']
          for feed, archive in [('latest-exe.json','ChankiHelper_v0.7.12_update.zip'), ('latest.json','MumuCollector_v0.7.12.zip')]:
              m = json.loads((p/feed).read_text(encoding='utf-8'))
              z = p/archive
              assert m['version']=='0.7.12' and m['size']==z.stat().st_size
              assert m['sha256']==hashlib.sha256(z.read_bytes()).hexdigest()
          print('Reviewed Windows build and both update archives verified')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Release byte validation failed' }
      - name: Publish automatic update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latest = gh api repos/93choissnim-dot/mumu-collector-updates/releases/latest --jq .tag_name
          if ($LASTEXITCODE -ne 0) { throw 'Latest release check failed' }
          if ([version]($latest.TrimStart('v')) -ge [version]'0.7.12') { throw 'Same or newer release already exists' }
          $notes = Get-Content release_source/v0.7.12/notes.md -Raw -Encoding utf8
          $notes += "`n`nWindows 검증 기록: https://github.com/93choissnim-dot/mumu-collector-updates/actions/runs/35514758426`n"
          Set-Content -Path release-notes.md -Value $notes -Encoding utf8
          gh release edit v0.7.12 --repo 93choissnim-dot/mumu-collector-updates --draft=false --latest --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
      - name: Verify public automatic update address
        shell: pwsh
        run: |
          python -c "import urllib.request,json; u='https://github.com/93choissnim-dot/mumu-collector-updates/releases/latest/download/latest-exe.json'; m=json.load(urllib.request.urlopen(u,timeout=30)); e=json.load(open('verified/latest-exe.json',encoding='utf-8')); assert m==e; print('Public update channel verified: v'+m['version'])"
          if ($LASTEXITCODE -ne 0) { throw 'Public update channel verification failed' }
