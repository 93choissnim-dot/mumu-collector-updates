name: Export verified release source
on:
  push:
    branches: [main]
    paths: ['.github/workflows/export-reviewed-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download and verify released source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v0.7.87 --repo 93choissnim-dot/mumu-collector-updates --pattern MumuCollector_v0.7.87.zip
          echo '1443e05f715e0c6adc8e828f540eebfc20da399a7b530a0fac527fb91fd1c993  MumuCollector_v0.7.87.zip' | sha256sum --check
      - uses: actions/upload-artifact@v4
        with:
          name: verified-source-v087
          path: MumuCollector_v0.7.87.zip
          retention-days: 3
